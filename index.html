<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FX RAJXMODS - SSO</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
        background-color: #0f172a;
        background-image: radial-gradient(circle at 15% 50%, rgba(201, 36, 44, 0.15), transparent 25%), radial-gradient(circle at 85% 30%, rgba(59, 130, 246, 0.15), transparent 25%);
        color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;
    }
    .header { margin-bottom: 30px; text-align: center; }
    .header h1 { font-size: 32px; font-weight: 800; background: linear-gradient(90deg, #c9242c, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .content {
        background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 24px; padding: 40px 30px; width: 100%; max-width: 420px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        position: relative; overflow: hidden;
    }
    .content::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, transparent, #c9242c, #3b82f6, transparent); }
    .content h2 { font-size: 22px; font-weight: 600; text-align: center; margin-bottom: 25px; }
    .field { margin-bottom: 25px; position: relative; }
    .field label.star { position: absolute; top: 16px; left: 15px; color: #ef4444; font-weight: bold; font-size: 16px; }
    #email-input { width: 100%; background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 16px 16px 16px 30px; color: #f8fafc; font-size: 15px; outline: none; transition: 0.3s; }
    #email-input:focus { border-color: #c9242c; box-shadow: 0 0 0 3px rgba(201, 36, 44, 0.2); }
    .hint { font-size: 12px; color: #64748b; margin-top: 8px; }
    .btn { width: 100%; padding: 16px; border-radius: 12px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.3s; color: #ffffff; margin-bottom: 12px; }
    .btn-primary { background: linear-gradient(135deg, #c9242c, #991b1b); box-shadow: 0 10px 20px -10px rgba(201, 36, 44, 0.5); }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 15px 25px -10px rgba(201, 36, 44, 0.7); }
    .btn-secondary { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: #cbd5e1; }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.1); }
    .terms { font-size: 12px; color: #64748b; text-align: center; margin-top: 25px; }
    .terms a { color: #94a3b8; text-decoration: none; }
    #result-box { margin-top: 20px; padding: 15px; border-radius: 8px; background: rgba(0,0,0,0.3); display: none; font-size: 14px; border: 1px solid #334155; text-align: center; }
</style>
</head>
<body>

    <div class="header">
        <h1>FX RAJXMODS</h1>
    </div>

    <div class="content">
        <h2>Send Single Unsubscribe OTP</h2>
        <form id="otp-form">
            <div class="field">
                <label class="star">*</label>
                <input type="email" id="email-input" placeholder="Email" required>
                <div class="hint">Your email is required for Garena account recovery.</div>
            </div>
            
            <button type="button" class="btn btn-secondary" onclick="sendOtp('ingame')">Send In-game OTP</button>
            <button type="submit" class="btn btn-primary">Send Single Unsubscribe OTP</button>
            
            <p class="terms">By clicking Send OTP, you agree to our <a href="#">Terms of Service</a>.</p>
        </form>
        
        <div id="result-box"></div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
